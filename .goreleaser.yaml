version: 2

project_name: nordmac

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: nordmac
    main: ./cmd/nordmac
    binary: nordmac
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/b1rd33/nordmac/internal/buildinfo.Version={{ .Version }}
        -X github.com/b1rd33/nordmac/internal/buildinfo.Commit={{ .ShortCommit }}
        -X github.com/b1rd33/nordmac/internal/buildinfo.Date={{ .Date }}

archives:
  - id: nordmac
    ids:
      - nordmac
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: b1rd33
    name: nordmac
  draft: false
  prerelease: auto

homebrew_casks:
  - name: nordmac
    ids:
      - nordmac
    binaries:
      - nordmac
    repository:
      owner: b1rd33
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    url:
      verified: github.com/b1rd33/nordmac
    homepage: "https://github.com/b1rd33/nordmac"
    description: "Read-only NordVPN location and NordLynx server recommendation CLI for macOS"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/nordmac"]
          end
