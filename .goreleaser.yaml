version: 2

project_name: nordmac

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: nordmac
    main: ./cmd/nordmac
    binary: nordmac
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/b1rd33/nordmac/internal/buildinfo.Version={{ .Version }}
        -X github.com/b1rd33/nordmac/internal/buildinfo.Commit={{ .ShortCommit }}
        -X github.com/b1rd33/nordmac/internal/buildinfo.Date={{ .Date }}

archives:
  - id: nordmac
    ids:
      - nordmac
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: b1rd33
    name: nordmac
  draft: false
  prerelease: auto
