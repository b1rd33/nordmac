name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Cross-build macOS binaries
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o /tmp/nordmac-arm64 ./cmd/nordmac
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -o /tmp/nordmac-amd64 ./cmd/nordmac
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o /tmp/nordmac-wg-harness-arm64 ./cmd/nordmac-wg-harness
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -o /tmp/nordmac-wg-harness-amd64 ./cmd/nordmac-wg-harness
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o /tmp/nordmac-scoped-harness-arm64 ./cmd/nordmac-scoped-harness
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -o /tmp/nordmac-scoped-harness-amd64 ./cmd/nordmac-scoped-harness
      - name: Cross-compile macOS state tests
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go test -c -o /tmp/nordmac-state-arm64.test ./internal/state
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go test -c -o /tmp/nordmac-state-amd64.test ./internal/state

  native-keychain:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache: true
      - name: Build and validate native Keychain boundary
        run: scripts/test_native_keychain.sh
      - name: Simulate login against loopback and an isolated Keychain
        run: scripts/test_synthetic_login.sh
      - name: Build and inspect ad-hoc release snapshot
        run: |
          scripts/package_macos_release.sh ci "$RUNNER_TEMP/nordmac-dist"
          for archive in "$RUNNER_TEMP"/nordmac-dist/nordmac_*.zip; do
            verify_directory="$(mktemp -d "$RUNNER_TEMP/nordmac-ci-verify.XXXXXXXX")"
            ditto -x -k "$archive" "$verify_directory"
            helper_sha256="$(shasum -a 256 "$verify_directory/libexec/nordmac-keychain-helper" | awk '{print $1}')"
            embedded_sha256="$("$verify_directory/nordmac" version --json | jq -r '.data.helper_sha256')"
            manifest_sha256="$(jq -r '.helper_sha256' "$verify_directory/nordmac-helper-manifest.json")"
            test "$helper_sha256" = "$embedded_sha256"
            test "$helper_sha256" = "$manifest_sha256"
            codesign --verify --strict --verbose=2 "$verify_directory/nordmac"
            codesign --verify --strict --verbose=2 "$verify_directory/libexec/nordmac-keychain-helper"
            test -f "$verify_directory/THIRD_PARTY_NOTICES.md"
            find "$verify_directory" -depth -delete
          done
          (cd "$RUNNER_TEMP/nordmac-dist" && shasum -a 256 -c checksums.txt)
