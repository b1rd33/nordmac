name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Cross-build macOS binaries
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o /tmp/nordmac-arm64 ./cmd/nordmac
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -o /tmp/nordmac-amd64 ./cmd/nordmac
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o /tmp/nordmac-wg-harness-arm64 ./cmd/nordmac-wg-harness
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -o /tmp/nordmac-wg-harness-amd64 ./cmd/nordmac-wg-harness
      - name: Cross-compile macOS state tests
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go test -c -o /tmp/nordmac-state-arm64.test ./internal/state
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go test -c -o /tmp/nordmac-state-amd64.test ./internal/state
