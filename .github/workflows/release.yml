name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  adhoc-macos-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache: true
      - name: Build ad-hoc architecture-specific archives
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/package_macos_release.sh "$version" "$RUNNER_TEMP/nordmac-dist"
      - name: Verify ad-hoc release contents
        run: |
          for archive in "$RUNNER_TEMP"/nordmac-dist/nordmac_*.zip; do
            verify_directory="$(mktemp -d "$RUNNER_TEMP/nordmac-verify.XXXXXXXX")"
            ditto -x -k "$archive" "$verify_directory"
            helper_sha256="$(shasum -a 256 "$verify_directory/libexec/nordmac-keychain-helper" | awk '{print $1}')"
            embedded_sha256="$("$verify_directory/nordmac" version --json | jq -r '.data.helper_sha256')"
            manifest_sha256="$(jq -r '.helper_sha256' "$verify_directory/nordmac-helper-manifest.json")"
            test "$helper_sha256" = "$embedded_sha256"
            test "$helper_sha256" = "$manifest_sha256"
            codesign --verify --strict --verbose=2 "$verify_directory/nordmac"
            codesign --verify --strict --verbose=2 "$verify_directory/libexec/nordmac-keychain-helper"
            "$verify_directory/nordmac" --version
            test -f "$verify_directory/THIRD_PARTY_NOTICES.md"
            find "$verify_directory" -depth -delete
          done
          (cd "$RUNNER_TEMP/nordmac-dist" && shasum -a 256 -c checksums.txt)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP"/nordmac-dist/nordmac_*.zip \
            "$RUNNER_TEMP/nordmac-dist/checksums.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "nordmac $GITHUB_REF_NAME"
